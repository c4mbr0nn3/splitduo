---
services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: splitduo-db
    environment:
      POSTGRES_DB: splitduo
      POSTGRES_USER: splitduo
      POSTGRES_PASSWORD: splitduo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Bound to loopback: the app reaches PostgreSQL over the compose network,
      # so publishing on 0.0.0.0 would only expose the database to the host's
      # network. Use 127.0.0.1 for local tools such as psql or a GUI client.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitduo -d splitduo"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - splitduo-network

  # SplitDuo Application
  splitduo-app:
    image: j1mm0/splitduo:latest
    container_name: splitduo-app
    environment:
      # Database Configuration
      SD_DB_HOST: postgres
      SD_DB_PORT: 5432
      SD_DB_NAME: splitduo
      SD_DB_USERNAME: splitduo
      SD_DB_PASSWORD: splitduo

      # Initial Admin User
      SD_INITIAL_USER_EMAIL: admin@splitduo.local
      SD_INITIAL_USER_FIRSTNAME: Admin
      SD_INITIAL_USER_LASTNAME: User
      # Required — set in a .env file next to this compose file
      SD_INITIAL_USER_PASSWORD: ${SD_INITIAL_USER_PASSWORD:?SD_INITIAL_USER_PASSWORD must be set (min 15 chars) - see docs/self-hosting.md}

      # JWT signing key. Read from .env; the fallback keeps an existing stack
      # booting, but it is a published value — set SD_JWT_SECRET_KEY before
      # anyone enrols in 2FA, which derives its encryption key from this.
      SD_JWT_SECRET_KEY: "${SD_JWT_SECRET_KEY:-your-super-secret-jwt-key-change-this-in-production}"

      # AI Configuration (Optional - for receipt scanning)
      # SD_AI_BASE_URL: ""
      # SD_AI_API_KEY: ""
      # SD_AI_MODEL: ""

      # Email Configuration (Optional - for notifications)
      SD_EMAIL_SENDER_NAME: SplitDuo
      SD_EMAIL_SENDER_ADDRESS: noreply@splitduo.local
      SD_EMAIL_SMTP_HOST: localhost
      SD_EMAIL_SMTP_PORT: 587
      SD_EMAIL_SMTP_USERNAME: ""
      SD_EMAIL_SMTP_PASSWORD: ""
      SD_EMAIL_SSL: "false"
    ports:
      - "3000:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app_logs:/app/logs
    networks:
      - splitduo-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
    driver: local
  app_logs:
    driver: local

networks:
  splitduo-network:
    driver: bridge