# GitLab CI/CD Pipeline for SplitDuo
#
# Pipeline composition lives in ci/*.yml — this file only declares the shared
# stages and includes the per-concern job files. Add new CI concerns as new
# files under ci/ and include them here.

stages:
  - verify
  - build
  - test
  - release

include:
  - local: ci/verify.yml
  - local: ci/build.yml
  - local: ci/integration-tests.yml
  - local: ci/release.yml