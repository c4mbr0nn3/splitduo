# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration
#
# Tuned for SplitDuo: plain section names (no emoji) to match the existing
# CHANGELOG.md style. Reads Conventional Commits from git history.

[changelog]
header = """
# Changelog\n
All notable changes to SplitDuo will be documented in this file.\n
Generated with [git-cliff](https://git-cliff.org) from Conventional Commits.\n
"""
# A Tera template rendered for each release.
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}
"""
# Remove leading and trailing whitespaces from the changelog's body.
trim = true
# Render body even when there are no releases to process.
render_always = false
# An array of regex based postprocessors to modify the changelog.
postprocessors = []

[git]
# Parse commits according to the conventional commits specification.
conventional_commits = true
# Exclude commits that do not match the conventional commits specification.
filter_unconventional = true
# Require all commits to be conventional.
require_conventional = false
# Split commits on newlines, treating each line as an individual commit.
split_commits = false
# An array of regex based parsers to modify commit messages prior to processing.
commit_preprocessors = []
# Prevent commits that are breaking from being excluded by commit parsers.
protect_breaking_commits = false
# An array of regex based parsers for extracting data from the commit message.
# Assigns commits to groups. Ordered to match the existing CHANGELOG.md section
# naming (Features, Bug Fixes, Code Refactoring, Documentation, Styling,
# Build System, Maintenance). The hidden ordering prefix keeps groups stable.
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^refactor", group = "Code Refactoring" },
    { message = "^style", group = "Styling" },
    { message = "^perf", group = "Performance" },
    { message = "^test", group = "Testing" },
    { message = "^build", group = "Build System" },
    { message = "^ci", group = "Build System" },
    # Skip documentation commits (not user-facing).
    { message = "^doc", skip = true },
    # Skip the noisy per-release version bump commits (owned by bump-version.sh).
    { message = "^chore: bump version to", skip = true },
    # Skip dependency-only chore commits that carry no user-facing signal.
    { message = "^chore\\(deps.*\\)", skip = true },
    { message = "^chore\\(pr\\)", skip = true },
    { message = "^chore\\(pull\\)", skip = true },
    # Skip all other chore commits (maintenance noise, not user-facing).
    { message = "^chore|^ci", skip = true },
    { body = ".*security", group = "Security" },
    { message = "^revert", group = "Reverts" },
    { message = ".*", group = "Other" },
]
# Exclude commits that are not matched by any commit parser.
filter_commits = false
# Fail on a commit that is not matched by any commit parser.
fail_on_unmatched_commit = false
# Link parsers for extracting external references into URLs.
link_parsers = []
# Include only the tags that belong to the current branch.
use_branch_tags = false
# Order releases topologically instead of chronologically.
topo_order = false
# Order commits topologically instead of chronologically.
topo_order_commits = true
# Order of commits in each group/release within the changelog.
sort_commits = "oldest"
# Process submodules commits.
recurse_submodules = false