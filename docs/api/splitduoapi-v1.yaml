        isSingleton:
          type: boolean
        createdAt:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          format: int64
        updatedAt:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
