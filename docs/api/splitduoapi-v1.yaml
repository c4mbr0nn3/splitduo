    AcceptInvitationRequestDto:
      required:
        - token
        - firstName
        - lastName
        - password
        - confirmPassword
      type: object
      properties:
        token:
          type: string
        firstName:
          maxLength: 100
          type: string
        lastName:
          maxLength: 100
          type: string
        password:
          type: string
        confirmPassword:
          type: string
        uiLanguage:
          type:
            - "null"
