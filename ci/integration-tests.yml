# Integration tests for SplitDuo backend
# SplitDuo CI — test stage
#
# Runs the xUnit integration tests (SplitDuo.Tests.Integration) with a real
# PostgreSQL container spun up by Testcontainers. Produces a Cobertura
# coverage report consumed by GitLab's coverage visualization (MR annotations
# + pipeline widget percentage).
#
# Manual trigger on every branch — never runs automatically.

stages:
  - test

integration-tests:
  stage: test
  image: docker:28
  services:
    - docker:28-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
    # Testcontainers talks to the Docker daemon via DOCKER_HOST; under dind the
    # socket is at /var/run/docker.sock inside the service container.
    DOCKER_HOST: "tcp://docker:2376"
    TESTCONTAINERS_RYUK_DISABLED: "true"
    ASPNETCORE_ENVIRONMENT: "Development"
    SD_JWT_SECRET_KEY: "ci-integration-secret-key-32-chars-min!!"
    SD_JWT_ISSUER: "test"
    SD_JWT_AUDIENCE: "test"
    SD_SEED_DEMO_DATA: "false"
  script:
    # Run the integration tests inside the .NET 10 SDK container, mounting the
    # Docker socket so Testcontainers can spawn the PostgreSQL sidecar.
    - |
      docker run --rm \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -v "$CI_PROJECT_DIR":/src -w /src \
        -e DOCKER_HOST="unix:///var/run/docker.sock" \
        -e TESTCONTAINERS_RYUK_DISABLED="true" \
        -e ASPNETCORE_ENVIRONMENT="$ASPNETCORE_ENVIRONMENT" \
        -e SD_JWT_SECRET_KEY="$SD_JWT_SECRET_KEY" \
        -e SD_JWT_ISSUER="$SD_JWT_ISSUER" \
        -e SD_JWT_AUDIENCE="$SD_JWT_AUDIENCE" \
        -e SD_SEED_DEMO_DATA="$SD_SEED_DEMO_DATA" \
        mcr.microsoft.com/dotnet/sdk:10.0 \
        sh -c '
          cd /src/sd-backend &&
          dotnet test SplitDuo.Tests.Integration/SplitDuo.Tests.Integration.csproj \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --logger "junit;LogFilePath=test-results.xml" &&
          dotnet tool install --global dotnet-reportgenerator-globaltool &&
          export PATH="$PATH:$HOME/.dotnet/tools" &&
          reportgenerator \
            -reports:"./TestResults/**/coverage.cobertura.xml" \
            -targetdir:"./coverage" \
            -reporttypes:"Cobertura;TextSummary" &&
          echo "----- coverage summary -----" &&
          sed -n "/Summary/,/^$/p" coverage/Summary.txt
        '
    # Copy the merged report out of the container-friendly path into the
    # project root so the artifacts paths resolve regardless of working dir.
    - cp sd-backend/coverage/Cobertura.xml coverage.xml
    - cp sd-backend/TestResults/test-results.xml junit-results.xml 2>/dev/null || true
  coverage: '/Line coverage: (\d+\.?\d*)%/'
  rules:
    # Manual on branches only — never on tags (version bumps/releases) and
    # never automatic.
    - if: $CI_COMMIT_TAG
      when: never
    - when: manual
      allow_failure: true
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: junit-results.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml