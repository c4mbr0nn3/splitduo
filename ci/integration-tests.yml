# Integration tests for SplitDuo backend
# SplitDuo CI — test stage
#
# Runs the xUnit integration tests (SplitDuo.Tests.Integration) with a real
# PostgreSQL container spun up by Testcontainers against the dind daemon.
# Produces a Cobertura coverage report consumed by GitLab's coverage
# visualization (MR annotations + pipeline widget percentage).
#
# The job image is the .NET SDK directly (not docker:28) so `dotnet restore`
# runs in the job container with normal internet access to nuget.org. dind is
# only used as the Docker daemon for Testcontainers, reached over TCP.
#
# Manual trigger on every branch — never runs automatically, never on tags.

stages:
  - test

integration-tests:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  services:
    # No explicit alias — `docker` is the default alias GitLab assigns. Setting
    # it explicitly triggers a "Skipping alias" warning. No custom command —
    # the dind entrypoint sets up TLS certs when DOCKER_TLS_CERTDIR is non-empty.
    - docker:28-dind
  variables:
    # Docker daemon connection (TLS enabled — default on gitlab.com shared
    # runners). The runner mounts /certs/client into the job container.
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    # Testcontainers talks to the Docker API directly (Docker.DotNet), no CLI.
    # Ryuk resource reaper is disabled — it can't reach back to the daemon in dind.
    TESTCONTAINERS_RYUK_DISABLED: "true"
    ASPNETCORE_ENVIRONMENT: "Development"
    SD_JWT_SECRET_KEY: "ci-integration-secret-key-32-chars-min!!"
    SD_JWT_ISSUER: "test"
    SD_JWT_AUDIENCE: "test"
    SD_SEED_DEMO_DATA: "false"
  script:
    - cd sd-backend
    - |
      dotnet test SplitDuo.Tests.Integration/SplitDuo.Tests.Integration.csproj \
        --configuration Release \
        --collect:"XPlat Code Coverage" \
        --results-directory ./TestResults \
        --logger "junit;LogFilePath=test-results.xml"
    - |
      dotnet tool install --global dotnet-reportgenerator-globaltool
      export PATH="$PATH:$HOME/.dotnet/tools"
      reportgenerator \
        -reports:"./TestResults/**/coverage.cobertura.xml" \
        -targetdir:"./coverage" \
        -reporttypes:"Cobertura;TextSummary"
    - echo "----- coverage summary -----"
    - sed -n "/Summary/,/^$/p" coverage/Summary.txt
    # Move reports to the project root so artifact paths resolve regardless
    # of the working directory GitLab uses when collecting artifacts.
    - mv coverage/Cobertura.xml "$CI_PROJECT_DIR/coverage.xml"
    - mv TestResults/test-results.xml "$CI_PROJECT_DIR/junit-results.xml" 2>/dev/null || true
  coverage: '/Line coverage: (\d+\.?\d*)%/'
  rules:
    # Manual on branches only — never on tags (version bumps/releases) and
    # never automatic.
    - if: $CI_COMMIT_TAG
      when: never
    - when: manual
      allow_failure: true
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: junit-results.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml