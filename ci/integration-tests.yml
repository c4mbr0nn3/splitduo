# Integration tests for SplitDuo backend
# SplitDuo CI — test stage
#
# Runs the xUnit integration tests (SplitDuo.Tests.Integration) with a real
# PostgreSQL container spun up by Testcontainers against the dind daemon.
# Produces a Cobertura coverage report consumed by GitLab's coverage
# visualization (MR annotations + pipeline widget percentage).
#
# The job image is the .NET SDK directly (not docker:28) so `dotnet restore`
# runs in the job container with normal internet access to nuget.org. dind is
# only used as the Docker daemon for Testcontainers, reached over TCP.
#
# Auto on version tags (release gate) — stable vX.Y.Z and RC vX.Y.Z-rc.N
# (RC is a release gate too); manual with allow_failure everywhere else.

stages:
  - test

integration-tests:
  stage: test
  tags:
    - homelab
  # Serialized against security:trivy — see ci/security.yml for the incident.
  # dind pulls the Postgres image and writes test databases while Trivy
  # unpacks a ~1.4 GB vulnerability DB; both land on the runner host disk, so
  # allowing them to run in parallel across pipelines turns into a shared
  # ENOSPC that surfaces as Postgres error 53100 deep inside a test run.
  resource_group: homelab-disk-heavy
  image: mcr.microsoft.com/dotnet/sdk:10.0
  services:
    # No explicit alias — `docker` is the default alias GitLab assigns. Setting
    # it explicitly triggers a "Skipping alias" warning. No custom command —
    # the dind entrypoint sets up TLS certs when DOCKER_TLS_CERTDIR is non-empty.
    - docker:28-dind
  variables:
    # Docker daemon connection (TLS enabled — default on gitlab.com shared
    # runners). The runner mounts /certs/client into the job container.
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    # Testcontainers talks to the Docker API directly (Docker.DotNet), no CLI.
    # Ryuk resource reaper is disabled — it can't reach back to the daemon in dind.
    TESTCONTAINERS_RYUK_DISABLED: "true"
    ASPNETCORE_ENVIRONMENT: "Development"
    SD_JWT_SECRET_KEY: "ci-integration-secret-key-32-chars-min!!"
    SD_JWT_ISSUER: "test"
    SD_JWT_AUDIENCE: "test"
    SD_SEED_DEMO_DATA: "false"
  script:
    # Log the free space up front: when this job dies with Postgres error
    # 53100 ("could not extend file … No space left on device") the cause is
    # the shared runner disk, not the code under test.
    - df -h /
    - |
      avail_kb=$(df -Pk / | awk 'NR==2 {print $4}')
      echo "Preflight: ${avail_kb} KiB free (need 1572864)"
      if [ "$avail_kb" -lt 1572864 ]; then
        echo "ERROR: only ${avail_kb} KiB free on the runner filesystem; dind + Postgres + the test run need over 1 GiB."
        echo "This is runner capacity, not a code issue: free space on the runner host (e.g. docker system prune) and retry the job."
        exit 1
      fi
    - cd sd-backend
    - |
      dotnet test SplitDuo.Tests.Integration/SplitDuo.Tests.Integration.csproj \
        --configuration Release \
        --collect:"XPlat Code Coverage" \
        --results-directory ./TestResults \
        --logger "junit;LogFilePath=test-results.xml"
    - |
      dotnet tool install --global dotnet-reportgenerator-globaltool
      export PATH="$PATH:$HOME/.dotnet/tools"
      reportgenerator \
        -reports:"./TestResults/**/coverage.cobertura.xml" \
        -targetdir:"./coverage" \
        -reporttypes:"Cobertura;TextSummary"
    - echo "----- coverage summary -----"
    - sed -n "/Summary/,/^$/p" coverage/Summary.txt
    # Move reports to the project root so artifact paths resolve regardless
    # of the working directory GitLab uses when collecting artifacts. The
    # JUnit logger writes next to the test project (LogFilePath is relative to
    # the test assembly's directory, not --results-directory).
    - mv coverage/Cobertura.xml "$CI_PROJECT_DIR/coverage-integration.xml"
    - mv SplitDuo.Tests.Integration/test-results.xml "$CI_PROJECT_DIR/junit-results-integration.xml"
  rules:
    # Auto on version tags (stable vX.Y.Z or RC vX.Y.Z-rc.N) — integration
    # tests are a release gate for both.
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-rc\.\d+)?$/
      when: on_success
    # Release commits (chore: bump version to …) are skipped on main — the
    # same commit is tagged vX.Y.Z, which triggers the tag pipeline above.
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_MESSAGE =~ /chore: bump version to \d+\.\d+\.\d+/'
      when: never
    # Auto on main — integration tests gate the default branch so the
    # coverage badge reflects real aggregate (unit + integration) coverage.
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
    # Manual everywhere else (branches, MRs), allowed to fail.
    - when: manual
      allow_failure: true
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - coverage-integration.xml
    reports:
      junit: junit-results-integration.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage-integration.xml