# Build and push multi-arch Docker images to Docker Hub
# SplitDuo CI — build stage
# Phase 2: native per-arch builds on GitLab.com SaaS runners + manifest merge
#
# Tag policy is enforced by an explicit, mutually-exclusive branch in
# merge_manifest so an RC tag can never publish :latest:
#   vX.Y.Z-rc.N  -> :X.Y.Z-rc.N + moving :rc   (never :latest)
#   vX.Y.Z       -> :X.Y.Z + :latest
#   branch       -> :<sanitized-branch>        (manual pipelines only)
#
# RC tags are tag-only and are never written to ./VERSION, so tag pipelines
# derive APP_VERSION from $CI_COMMIT_TAG; branch pipelines fall back to VERSION.
#
# Per-arch scratch tags are namespaced with $CI_PIPELINE_ID so a stable
# pipeline and an RC pipeline can never overwrite each other's temp images.

image: docker:28

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_NAME: "j1mm0/splitduo"

.build_template:
  stage: build
  before_script:
    - echo $DOCKER_HUB_PASSWORD | docker login -u $DOCKER_HUB_USERNAME --password-stdin
    - docker context create tls-env
    - docker buildx create --use --driver docker-container tls-env
  script:
    # Derive the app version: tag pipelines (stable and RC) use the tag,
    # branch pipelines use the VERSION file.
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
      else
        VERSION=$(cat VERSION)
      fi
    - ARCH=${CI_JOB_NAME#build_}
    - docker buildx build
      --platform linux/$ARCH
      --provenance=mode=max
      --sbom=true
      --build-arg APP_VERSION=$VERSION
      --build-arg GIT_REVISION=$CI_COMMIT_SHA
      --build-arg BUILD_DATE=$CI_COMMIT_TIMESTAMP
      --build-arg BUILDKIT_INLINE_CACHE=1
      --cache-from $IMAGE_NAME:latest
      -t $IMAGE_NAME:temp-$ARCH-$CI_PIPELINE_ID
      --push
      .
  after_script:
    - docker logout
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-rc\.\d+)?$/
      when: on_success
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main"
      when: manual

build_amd64:
  extends: .build_template
  services:
    - docker:28-dind

build_arm64:
  extends: .build_template
  tags:
    - saas-linux-small-arm64
  services:
    - name: docker:28-dind
      command: ["--mtu=1400"]

merge_manifest:
  stage: build
  needs:
    - build_amd64
    - build_arm64
  image: docker:28
  before_script:
    - apk add --no-cache curl
    - echo $DOCKER_HUB_PASSWORD | docker login -u $DOCKER_HUB_USERNAME --password-stdin
  script:
    # Merge per-arch temp images into a single multi-arch manifest.
    # The tag decision is an explicit mutually-exclusive branch: the RC case
    # (checked first) publishes :rc and a version tag and can never reach the
    # stable branch that pushes :latest.
    - |
      SRC="$IMAGE_NAME:temp-amd64-$CI_PIPELINE_ID $IMAGE_NAME:temp-arm64-$CI_PIPELINE_ID"
      if [ -n "$CI_COMMIT_TAG" ]; then
        if echo "$CI_COMMIT_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'; then
          VERSION_TAG=${CI_COMMIT_TAG#v}
          docker buildx imagetools create -t $IMAGE_NAME:$VERSION_TAG $SRC
          docker buildx imagetools create -t $IMAGE_NAME:rc $SRC
          echo "Pushed RC manifests: $VERSION_TAG + rc"
        elif echo "$CI_COMMIT_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
          VERSION_TAG=${CI_COMMIT_TAG#v}
          docker buildx imagetools create -t $IMAGE_NAME:$VERSION_TAG $SRC
          docker buildx imagetools create -t $IMAGE_NAME:latest $SRC
          echo "Pushed stable manifests: $VERSION_TAG + latest"
        else
          echo "Unrecognized tag '$CI_COMMIT_TAG' — refusing to publish"
          exit 1
        fi
      elif [ "$CI_COMMIT_REF_NAME" != "main" ]; then
        BRANCH_TAG=$(echo $CI_COMMIT_REF_NAME | sed 's/[^a-zA-Z0-9._-]/-/g')
        docker buildx imagetools create -t $IMAGE_NAME:$BRANCH_TAG $SRC
        echo "Pushed branch multi-arch manifest: $BRANCH_TAG"
      fi
    # Delete temporary per-arch tags from Docker Hub
    - |
      TOKEN_RESPONSE=$(curl -s -X POST https://hub.docker.com/v2/auth/token -H "Content-Type: application/json" -d "{\"identifier\":\"$DOCKER_HUB_USERNAME\",\"secret\":\"$DOCKER_HUB_PASSWORD\"}")
      ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
      if [ -z "$ACCESS_TOKEN" ]; then
        echo "ERROR: failed to obtain Docker Hub access token (check DOCKER_HUB_USERNAME / DOCKER_HUB_PASSWORD)"
        exit 1
      fi
      for TAG in temp-amd64-$CI_PIPELINE_ID temp-arm64-$CI_PIPELINE_ID; do
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE "https://hub.docker.com/v2/repositories/$IMAGE_NAME/tags/$TAG/" -H "Authorization: Bearer $ACCESS_TOKEN")
        case "$STATUS" in
          200|204)
            echo "Deleted $IMAGE_NAME:$TAG"
            ;;
          404)
            echo "$IMAGE_NAME:$TAG already removed"
            ;;
          401)
            echo "ERROR: unauthorized deleting $IMAGE_NAME:$TAG (check PAT permissions)"
            exit 1
            ;;
          403)
            echo "WARNING: forbidden deleting $IMAGE_NAME:$TAG (PAT may lack 'Delete' permission); continuing"
            ;;
          *)
            echo "WARNING: unexpected HTTP $STATUS deleting $IMAGE_NAME:$TAG; continuing"
            ;;
        esac
      done
  after_script:
    - docker logout
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-rc\.\d+)?$/
      when: on_success
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main"
      when: manual