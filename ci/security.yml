# Security scans for SplitDuo
# SplitDuo CI — verify stage
#
# Runs Trivy (CVE) and TruffleHog (secrets) directly as the job image — no
# dind, no `docker run` wrapper. The scanner image IS the job container, so
# the scanner runs natively against the checked-out repo at $CI_PROJECT_DIR.
# This is simpler and faster than the local scripts/security.sh path (which
# wraps `docker run` because the scanner binaries aren't installed locally)
# and avoids a dind service entirely.
#
# Images are pinned by digest (sha256) for supply-chain integrity — a mutable
# tag like `latest` could be repushed with different content. The version tag
# (e.g. 0.73.0) is itself immutable, so version+digest is the strongest pin.
# Bump the digest deliberately: check the upstream image, verify the new SHA,
# and update both the tag and digest here.
#
# Trivy fails on HIGH/CRITICAL findings (--exit-code 1).
# TruffleHog runs in --no-verification mode in CI: verification requires
# outbound calls to the leaked-credential providers, which the runner
# network may block or rate-limit, and unverified findings are still
# actionable signals for review.
#
# TruffleHog excludes .git via --exclude-paths: the GitLab runner injects a
# masked CI token into .git/config during checkout, which is a false positive
# (not a secret in the repo). node_modules/.nuxt/.output are also excluded —
# they contain third-party code and generated files that produce noise.
# Trivy skips .git via --skip-dirs for the same reason and to avoid scanning
# the object store.
#
# Auto on version tags (release gate) and main pushes; manual with
# allow_failure on MRs and other branches so contributors can opt in without
# blocking their pipeline on a pre-existing finding. The tag rule matches
# stable vX.Y.Z AND RC vX.Y.Z-rc.N tags (RC is a release gate too).

stages:
  - verify

security:trivy:
  stage: verify
  tags:
    - homelab
  interruptible: true
  # Serialized against integration-tests — the other GB-scale homelab job.
  # A vulnerability-DB download peaks at ~1.6 GB (135 MB artifact plus the
  # ~1.4 GB sqlite it unpacks into), and a concurrent dind run pulls the
  # Postgres image and writes test databases onto the same host filesystem.
  # Resource groups are mutually exclusive across pipelines of the project,
  # so a tag pipeline's gate cannot collide with another pipeline's dind
  # run. That collision is what failed v1.18.0-rc.2: this job died with
  # `no space left on device` while integration-tests on the same commit hit
  # Postgres error 53100 in the same second.
  resource_group: homelab-disk-heavy
  image:
    name: docker.io/aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    entrypoint: [""]
  script:
    # Check the disk before downloading anything. A scan writes a 135 MB
    # artifact to the temp dir and unpacks ~1.4 GB into the cache, so on a
    # full disk Trivy dies mid-download with a bare ENOSPC that reads like a
    # scanner bug. df reports the filesystem backing the container's
    # writable layer — the runner host disk the DB write competes for — and
    # a shortfall is a runner-capacity incident, not something this job can
    # fix, so fail with the remedy in the message.
    - df -h /
    - |
      avail_kb=$(df -Pk / | awk 'NR==2 {print $4}')
      echo "Preflight: ${avail_kb} KiB free (need 1572864)"
      if [ "$avail_kb" -lt 1572864 ]; then
        echo "ERROR: only ${avail_kb} KiB free on the runner filesystem; the Trivy vulnerability DB needs about 1.6 GiB."
        echo "This is runner capacity, not a code issue: free space on the runner host (e.g. docker system prune) and retry the job."
        exit 1
      fi
    - trivy fs . --severity HIGH,CRITICAL --format table --skip-dirs .git --skip-dirs website --ignorefile .trivyignore --exit-code 1
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-rc\.\d+)?$/
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_MESSAGE =~ /chore: bump version to \d+\.\d+\.\d+/'
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
    - when: manual
      allow_failure: true

security:trufflehog:
  stage: verify
  tags:
    - homelab
  interruptible: true
  image:
    name: docker.io/trufflesecurity/trufflehog:3.97.9@sha256:52e67fef4d054ecff5c2ce4b4ae376626d1ef54aa0898b53cac19c25e92e14db
    entrypoint: [""]
  script:
    # Exclude .git (GitLab runner injects a masked CI token into .git/config
    # during checkout — a false positive, not a repo secret) and common build
    # artifact dirs that contain third-party code or generated files.
    # These are regexes matched against absolute paths, so anchor them: an
    # unanchored `.git` also matches `.gitlab-ci.yml`, `.gitlab/` and
    # `.gitignore`, silently keeping them out of the scan.
    - printf '(^|/)\\.git(/|$)\n(^|/)node_modules(/|$)\n(^|/)\\.nuxt(/|$)\n(^|/)\\.output(/|$)\n' > /tmp/exclude-paths.txt
    - trufflehog filesystem . --no-verification --fail --exclude-paths=/tmp/exclude-paths.txt
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-rc\.\d+)?$/
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_MESSAGE =~ /chore: bump version to \d+\.\d+\.\d+/'
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
    - when: manual
      allow_failure: true