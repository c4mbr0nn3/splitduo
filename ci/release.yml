# GitLab + GitHub Release creation for SplitDuo
# SplitDuo CI — release stage
#
# Creates a GitLab Release and a GitHub Release for every v* tag pushed by
# scripts/bump-version.sh. The repo is mirrored to GitHub by GitLab
# (https://github.com/c4mbr0nn3/splitduo) — tags arrive there automatically,
# so the GitHub job only needs to create the release object.
#
# Release notes are extracted from CHANGELOG.md (generated by git-cliff) —
# the section between the tag's version header and the next version header.
#
# The GitLab release uses the native `release:` keyword (release-cli image,
# default CI job token). The GitHub release calls the GitHub Releases API via
# curl and requires a GitHub token stored as a GitLab CI variable:
#   GITHUB_TOKEN — PAT with `repo` scope, or fine-grained token with
#                  `Contents: read` + `Releases: write` on c4mbr0nn3/splitduo.
#                  Set it as a masked, protected variable in
#                  Settings → CI/CD → Variables.

stages:
  - release

# Shared changelog extraction — runs before both release jobs and publishes
# release_notes.md as an artifact they both consume.
extract_release_notes:
  stage: release
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*$/
      when: on_success
  script:
    - VERSION=${CI_COMMIT_TAG#v}
    - |
      DESCRIPTION=$(awk -v ver="$VERSION" '
        $0 ~ "^## \\[" ver "\\]" { found=1; next }
        found && /^## \[/ { exit }
        found { print }
      ' CHANGELOG.md)
    - |
      if [[ -z "$DESCRIPTION" ]]; then
        echo "Warning: no changelog section found for $VERSION; using fallback"
        DESCRIPTION="Release $CI_COMMIT_TAG"
      fi
    - echo "$DESCRIPTION" > release_notes.md
  artifacts:
    paths:
      - release_notes.md
    expire_in: 1 day

create_gitlab_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - extract_release_notes
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*$/
      when: on_success
  script:
    - echo "Creating GitLab Release for $CI_COMMIT_TAG"
    - VERSION=${CI_COMMIT_TAG#v}
  release:
    name: "Release $CI_COMMIT_TAG"
    description: release_notes.md
    tag_name: "$CI_COMMIT_TAG"
    assets:
      links:
        - name: "Docker image"
          url: "https://hub.docker.com/r/j1mm0/splitduo/tags?name=$VERSION"
          link_type: image

create_github_release:
  stage: release
  image: alpine:latest
  needs:
    - extract_release_notes
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*$/
      when: on_success
  before_script:
    - apk add --no-cache curl python3
  script:
    - echo "Creating GitHub Release for $CI_COMMIT_TAG in c4mbr0nn3/splitduo"
    # Build JSON payload with python (json.dumps escapes newlines correctly;
    # capturing jq output in a shell variable strips backslash escaping, so
    # write to a file and use curl --data @file).
    - |
      python3 -c "
      import json
      notes = open('release_notes.md').read()
      print(json.dumps({
          'tag_name': '$CI_COMMIT_TAG',
          'name': 'Release $CI_COMMIT_TAG',
          'body': notes,
          'target_commitish': 'main'
      }))
      " > payload.json
    - |
      HTTP_CODE=$(curl -sS -w "%{http_code}" -o response.json \
        --connect-timeout 10 --max-time 60 \
        -H "Authorization: Bearer $GITHUB_TOKEN" \
        -H "Accept: application/vnd.github+json" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        --data @payload.json \
        "https://api.github.com/repos/c4mbr0nn3/splitduo/releases")
    - |
      if [[ "$HTTP_CODE" == "201" ]]; then
        echo "✓ Created GitHub release $CI_COMMIT_TAG"
      elif [[ "$HTTP_CODE" == "422" ]]; then
        echo "⊘ Skipped $CI_COMMIT_TAG (GitHub release already exists)"
      else
        echo "✗ Failed to create GitHub release (HTTP $HTTP_CODE)"
        cat response.json
        exit 1
      fi