# GitLab Release creation for SplitDuo
# SplitDuo CI — release stage
#
# Creates a GitLab Release for every v* tag pushed by scripts/bump-version.sh.
# Release notes are extracted from CHANGELOG.md (generated by git-cliff) —
# the section between the tag's version header and the next version header.
#
# Uses GitLab's native `release:` keyword; the release-cli image is provided
# by GitLab and the runner invokes it automatically when the job completes.
# No extra credentials beyond the default CI job token are required.

stages:
  - release

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*$/
      when: on_success
  script:
    - echo "Creating GitLab Release for $CI_COMMIT_TAG"
    # Extract the changelog section for this version: from the matching
    # "## [VERSION]" header up to (but not including) the next "## [" header.
    - VERSION=${CI_COMMIT_TAG#v}
    - |
      DESCRIPTION=$(awk -v ver="$VERSION" '
        $0 ~ "^## \\[" ver "\\]" { found=1; next }
        found && /^## \[/ { exit }
        found { print }
      ' CHANGELOG.md)
    - |
      if [[ -z "$DESCRIPTION" ]]; then
        echo "Warning: no changelog section found for $VERSION; using fallback"
        DESCRIPTION="Release $CI_COMMIT_TAG"
      fi
    - echo "$DESCRIPTION" > release_notes.md
  release:
    name: "Release $CI_COMMIT_TAG"
    description: release_notes.md
    tag_name: "$CI_COMMIT_TAG"
    assets:
      links:
        - name: "Docker image"
          url: "https://hub.docker.com/r/j1mm0/splitduo/tags?name=$VERSION"
          link_type: image