# Quality gates for SplitDuo
# SplitDuo CI — verify stage
#
# Static analysis only: frontend lint/typecheck and security scans. Runs
# before test/build/release. The lint job uses node:22-alpine (matches the
# Dockerfile frontend stage); security jobs use pinned scanner images.
#
# Release commits (chore: bump version to …) are skipped on the main branch
# because the same commit is also tagged vX.Y.Z, which triggers an identical
# tag pipeline — running both would duplicate the work on unchanged code.

stages:
  - verify

lint:
  stage: verify
  image: node:22-alpine
  before_script:
    - corepack enable && corepack prepare pnpm@11.11.0 --activate
  script:
    - cd sd-frontend && pnpm install --frozen-lockfile && pnpm lint
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*$/
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_MESSAGE =~ /chore: bump version to \d+\.\d+\.\d+/'
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_success

typecheck:
  stage: verify
  image: node:22-alpine
  before_script:
    - corepack enable && corepack prepare pnpm@11.11.0 --activate
  script:
    - cd sd-frontend && pnpm install --frozen-lockfile && pnpm typecheck
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*$/
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_MESSAGE =~ /chore: bump version to \d+\.\d+\.\d+/'
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_success

unit-tests:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - cd sd-backend
    - |
      dotnet test SplitDuo.Tests.Unit/SplitDuo.Tests.Unit.csproj \
        --configuration Release \
        --collect:"XPlat Code Coverage" \
        --results-directory ./TestResults \
        --logger "junit;LogFilePath=test-results.xml"
    - |
      dotnet tool install --global dotnet-reportgenerator-globaltool
      export PATH="$PATH:$HOME/.dotnet/tools"
      reportgenerator \
        -reports:"./TestResults/**/coverage.cobertura.xml" \
        -targetdir:"./coverage" \
        -reporttypes:"Cobertura;TextSummary"
    - echo "----- coverage summary -----"
    - sed -n "/Summary/,/^$/p" coverage/Summary.txt
    - mv coverage/Cobertura.xml "$CI_PROJECT_DIR/coverage-unit.xml"
    - mv SplitDuo.Tests.Unit/test-results.xml "$CI_PROJECT_DIR/junit-results-unit.xml"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*$/
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_MESSAGE =~ /chore: bump version to \d+\.\d+\.\d+/'
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_success
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - coverage-unit.xml
    reports:
      junit: junit-results-unit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage-unit.xml
