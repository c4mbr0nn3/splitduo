# Aggregate coverage report for SplitDuo
# SplitDuo CI — coverage stage
#
# Merges the cobertura reports from unit-tests and integration-tests into a
# single aggregate report and publishes the combined line-coverage percentage
# as the pipeline's coverage value (the only job with a `coverage:` regex), so
# the README badge reflects real combined coverage instead of whichever test
# job happened to report last.
#
# Runs only when both upstream jobs ran automatically (main + tags). On MRs
# integration-tests is manual, so this job stays manual too — no partial
# aggregate is published.

stages:
  - coverage

aggregate-coverage:
  stage: coverage
  image: mcr.microsoft.com/dotnet/sdk:10.0
  needs:
    - job: unit-tests
      artifacts: true
    - job: integration-tests
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*$/
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_MESSAGE =~ /chore: bump version to \d+\.\d+\.\d+/'
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  before_script:
    - dotnet tool install --global dotnet-reportgenerator-globaltool
    - export PATH="$PATH:$HOME/.dotnet/tools"
  script:
    - reportgenerator \
        -reports:"coverage-unit.xml;coverage-integration.xml" \
        -targetdir:"./coverage-aggregate" \
        -reporttypes:"Cobertura;TextSummary"
    - echo "----- aggregate coverage summary -----"
    - sed -n "/Summary/,/^$/p" coverage-aggregate/Summary.txt
    - mv coverage-aggregate/Cobertura.xml "$CI_PROJECT_DIR/coverage.xml"
  coverage: '/Line coverage: (\d+\.?\d*)%/'
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml